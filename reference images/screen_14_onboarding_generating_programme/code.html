<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LEON - Generating Program</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-background": "#e2e2e8",
                        "on-tertiary-fixed-variant": "#594400",
                        "surface-tint": "#00daf3",
                        "surface-container-high": "#282a2e",
                        "primary-container": "#00e5ff",
                        "on-primary-container": "#00626e",
                        "inverse-on-surface": "#2f3035",
                        "secondary-container": "#454747",
                        "on-primary-fixed-variant": "#004f58",
                        "on-primary-fixed": "#001f24",
                        "surface-bright": "#37393e",
                        "on-tertiary": "#3e2e00",
                        "secondary-fixed-dim": "#c6c6c7",
                        "secondary": "#c6c6c7",
                        "on-secondary-fixed-variant": "#454747",
                        "on-tertiary-fixed": "#251a00",
                        "surface-variant": "#333539",
                        "primary-fixed-dim": "#00daf3",
                        "surface-dim": "#111318",
                        "surface-container": "#1e2024",
                        "on-primary": "#00363d",
                        "tertiary-fixed-dim": "#f3bf26",
                        "surface": "#111318",
                        "on-secondary-fixed": "#1a1c1c",
                        "error": "#ffb4ab",
                        "outline-variant": "#3b494c",
                        "tertiary-fixed": "#ffdf96",
                        "inverse-surface": "#e2e2e8",
                        "primary-fixed": "#9cf0ff",
                        "inverse-primary": "#006875",
                        "on-surface-variant": "#bac9cc",

                        "background": "#111318",

                        "on-tertiary-container": "#6f5500",
                        "outline": "#849396",
                        "error-container": "#93000a",
                        "surface-container-low": "#1a1c20",
                        "on-surface": "#e2e2e8",
                        "secondary-fixed": "#e2e2e2",
                        "on-error": "#690005",
                        "tertiary": "#ffeac0",
                        "primary": "#c3f5ff",
                        "surface-container-lowest": "#0c0e12",
                        "tertiary-container": "#fec931",
                        "on-secondary": "#2f3131"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-gap-sm": "12px",
                        "stack-gap-lg": "32px",
                        "container-margin": "24px",
                        "stack-gap-md": "20px",
                        "glass-padding": "24px"
                    },
                    fontFamily: {
                        "body-lg": ["Outfit", "sans-serif"],
                        "headline-sm": ["Outfit", "sans-serif"],
                        "data-md": ["JetBrains Mono", "monospace"],
                        "headline-md": ["Outfit", "sans-serif"],
                        "data-lg": ["JetBrains Mono", "monospace"],
                        "label-caps": ["JetBrains Mono", "monospace"],
                        "display-lg": ["Outfit", "sans-serif"],
                        "body-sm": ["Outfit", "sans-serif"]
                    },
                    keyframes: {
                        fadeInOut: {
                            '0%, 100%': { opacity: '0' },
                            '10%, 33%': { opacity: '1' },
                            '43%': { opacity: '0' },
                        },
                        progressFill: {
                            '0%': { width: '0%' },
                            '40%': { width: '45%' },
                            '70%': { width: '80%' },
                            '100%': { width: '100%' },
                        }
                    },
                    animation: {
                        'text-seq-1': 'fadeInOut 6s infinite 0s',
                        'text-seq-2': 'fadeInOut 6s infinite 2s',
                        'text-seq-3': 'fadeInOut 6s infinite 4s',
                        'progress': 'progressFill 6s ease-out forwards',
                    }
                }
            }
        }
    </script>
<style>
        .radar-sweep {
            transform-origin: 50px 50px;
            animation: sweep 3s linear infinite;
        }
        @keyframes sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .polygon-draw {
            animation: draw 2s ease-out forwards;
        }
        @keyframes draw {
            0% { clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-background font-body-lg antialiased selection:bg-primary-container selection:text-on-primary-container">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-hidden px-container-margin py-8">
<!-- Header -->
<div class="absolute top-8 left-0 right-0 flex justify-center">
<h2 class="text-on-background tracking-wide font-display-lg text-[28px] font-bold leading-tight uppercase opacity-80">LEON</h2>
</div>
<!-- Main Content Area -->
<div class="flex flex-col items-center justify-center w-full max-w-sm gap-stack-gap-lg">
<!-- Radar Animation -->
<div class="relative w-64 h-64 flex items-center justify-center text-primary-container drop-shadow-[0_0_15px_rgba(0,229,255,0.3)]">
<svg class="w-full h-full overflow-visible" viewbox="0 0 100 100">
<!-- Outer Grids -->
<polygon fill="none" opacity="0.2" points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" stroke="currentColor" stroke-width="0.5"></polygon>
<polygon fill="none" opacity="0.3" points="50,20 76,33 76,67 50,80 24,67 24,33" stroke="currentColor" stroke-width="0.5"></polygon>
<polygon fill="none" opacity="0.4" points="50,35 63,41.5 63,58.5 50,65 37,58.5 37,41.5" stroke="currentColor" stroke-width="0.5"></polygon>
<!-- Axes -->
<line opacity="0.3" stroke="currentColor" stroke-width="0.5" x1="50" x2="50" y1="50" y2="5"></line>
<line opacity="0.3" stroke="currentColor" stroke-width="0.5" x1="50" x2="95" y1="50" y2="27.5"></line>
<line opacity="0.3" stroke="currentColor" stroke-width="0.5" x1="50" x2="95" y1="50" y2="72.5"></line>
<line opacity="0.3" stroke="currentColor" stroke-width="0.5" x1="50" x2="50" y1="50" y2="95"></line>
<line opacity="0.3" stroke="currentColor" stroke-width="0.5" x1="50" x2="5" y1="50" y2="72.5"></line>
<line opacity="0.3" stroke="currentColor" stroke-width="0.5" x1="50" x2="5" y1="50" y2="27.5"></line>
<!-- Radar Sweep -->
<path class="radar-sweep" d="M50,50 L50,5 A45,45 0 0,1 95,50 Z" fill="currentColor" opacity="0.1"></path>
<!-- Data Polygon -->
<g class="polygon-draw">
<polygon fill="currentColor" fill-opacity="0.15" points="50,15 85,45 65,85 30,70 15,35" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"></polygon>
<!-- Nodes -->
<circle cx="50" cy="15" fill="currentColor" r="1.5"></circle>
<circle cx="85" cy="45" fill="currentColor" r="1.5"></circle>
<circle cx="65" cy="85" fill="currentColor" r="1.5"></circle>
<circle cx="30" cy="70" fill="currentColor" r="1.5"></circle>
<circle cx="15" cy="35" fill="currentColor" r="1.5"></circle>
</g>
</svg>
</div>
<!-- Scanning Text -->
<div class="relative h-6 w-full flex items-center justify-center font-data-md text-sm text-primary-container tracking-wider mt-4">
<div class="absolute opacity-0 animate-text-seq-1">ANALYSING PROFILE...</div>
<div class="absolute opacity-0 animate-text-seq-2">CALIBRATING SPLIT...</div>
<div class="absolute opacity-0 animate-text-seq-3">MAPPING MUSCLE GROUPS...</div>
</div>
</div>
<!-- Bottom Progress -->
<div class="absolute bottom-16 left-0 right-0 px-container-margin w-full max-w-sm mx-auto">
<div class="w-full bg-surface-container-highest h-1 rounded-full overflow-hidden">
<div class="bg-primary-container h-full w-0 animate-progress shadow-[0_0_10px_#00e5ff]"></div>
</div>
</div>
</div>
</body></html>
