<script>
        // Simple script to handle visual update of scroll wheel on scroll
        const picker = document.getElementById('height-picker');
        const items = picker.querySelectorAll('.snap-item');
        
        picker.addEventListener('scroll', () => {
            const pickerCenter = picker.getBoundingClientRect().top + picker.clientHeight / 2;
            
            items.forEach(item => {
                const itemCenter = item.getBoundingClientRect().top + item.clientHeight / 2;
                const distance = Math.abs(pickerCenter - itemCenter);
                
                // Reset classes
                item.className = 'snap-item h-[40px] flex items-center justify-center font-display-lg text-display-lg transition-all duration-300';
                
                if (distance < 30) {
                    item.classList.add('opacity-0'); // Hide selected value as it's shown below
                } else if (distance < 70) {
                    item.classList.add('text-outline/70');
                } else if (distance < 110) {
                    item.classList.add('text-outline/50');
                } else {
                    item.classList.add('text-outline/30');
                }
            });
        });
    </script>
