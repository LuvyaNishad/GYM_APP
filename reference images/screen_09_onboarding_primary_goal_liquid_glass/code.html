<!-- BottomNavBar and NavigationDrawer suppressed as per logical rules for Onboarding/Transactional screen -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.goal-option');
            const indicator = document.getElementById('processing-indicator');

            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected from all
                    options.forEach(opt => opt.classList.remove('selected'));
                    
                    // Add selected to clicked
                    this.classList.add('selected');
                    
                    // Update icon color logic for selected state via class
                    const icon = this.querySelector('.material-symbols-outlined');
                    if(icon) {
                        // The CSS handles the selected color now
                    }

                    // Show processing
                    indicator.classList.remove('opacity-0');

                    // Simulate auto-advance
                    setTimeout(() => {
                        // In a real app, this would route to the next screen
                        console.log('Advancing to next screen...');
                        document.body.style.opacity = '0';
                        document.body.style.transition = 'opacity 0.5s ease';
                    }, 800);
                });
            });
        });
