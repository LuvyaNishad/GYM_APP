<style>

        .glass-card {

            transition: all 0.3s ease;
        }
        
        .glass-card:active {
            transform: scale(0.98);
        }

        .injury-card.selected {

            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.15), 0 0 15px rgba(0, 229, 255, 0.1);
            background-color: rgba(0, 229, 255, 0.05);
        }

        .injury-card.none-selected {
            border-color: #00C853;
            box-shadow: inset 0 0 20px rgba(0, 200, 83, 0.15), 0 0 15px rgba(0, 200, 83, 0.1);
            background-color: rgba(0, 200, 83, 0.05);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.fill {

            width: 0;

<body class="min-h-screen flex flex-col items-center justify-start relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">

</div>

<!-- Main Content Canvas -->

<button class="injury-card glass-card w-full p-glass-padding rounded-xl flex items-center justify-between text-left group hover:bg-white/10 focus:outline-none focus:ring-1 focus:ring-primary-container" onclick="toggleSelection(this)">

</button>

<script>
        // Simple Interaction Logic
        function toggleSelection(element) {
            // If "NONE" is selected, deselect it
            const noneOption = document.getElementById('none-option');
            if (noneOption.classList.contains('none-selected')) {
                noneOption.classList.remove('none-selected');
                noneOption.querySelector('.none-check-icon').classList.replace('opacity-100', 'opacity-0');
            }

            // Toggle current element
            element.classList.toggle('selected');
            const checkIcon = element.querySelector('.check-icon');
            
            if (element.classList.contains('selected')) {
                checkIcon.classList.replace('opacity-0', 'opacity-100');
            } else {
                checkIcon.classList.replace('opacity-100', 'opacity-0');
            }
        }

        function toggleNoneSelection(element) {
            // Deselect all others
            const otherCards = document.querySelectorAll('.injury-card:not(#none-option)');
            otherCards.forEach(card => {
                card.classList.remove('selected');
                const check = card.querySelector('.check-icon');
                if (check) check.classList.replace('opacity-100', 'opacity-0');
            });

            // Toggle NONE
            element.classList.toggle('none-selected');
            const checkIcon = element.querySelector('.none-check-icon');
            
            if (element.classList.contains('none-selected')) {
                checkIcon.classList.replace('opacity-0', 'opacity-100');
            } else {
                checkIcon.classList.replace('opacity-100', 'opacity-0');
            }
        }

        // Trigger progress bar animation on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelector('.progress-fill').style.width = '77%';
            }, 100);
        });
    </script>
