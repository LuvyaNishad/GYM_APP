<div class="absolute bottom-0 w-1/2 h-[1px] bg-gradient-to-r from-transparent via-primary-container/40 to-transparent"></div>
</div>
<!-- Gradient Fades for depth -->

<div class="absolute bottom-0 inset-x-0 h-24 bg-gradient-to-t from-background via-background/80 to-transparent z-20 pointer-events-none"></div>

<div class="h-full w-full overflow-y-scroll snap-y snap-mandatory no-scrollbar z-10 relative pt-[110px] pb-[110px]" id="pickerContainer" style="scroll-behavior: smooth;">
<div class="picker-item snap-center h-[100px] flex items-center justify-center font-data-lg text-data-lg font-bold w-full inactive" data-value="1">1</div>
<div class="picker-item snap-center h-[100px] flex items-center justify-center font-data-lg text-data-lg font-bold w-full inactive" data-value="2">2</div>
<div class="picker-item snap-center h-[100px] flex items-center justify-center font-data-lg text-data-lg font-bold w-full inactive" data-value="3">3</div>
<div class="picker-item snap-center h-[100px] flex items-center justify-center font-data-lg text-data-lg font-bold w-full inactive" data-value="4">4</div>
<div class="picker-item snap-center h-[100px] flex items-center justify-center font-data-lg text-data-lg font-bold w-full active" data-value="5">5</div>
<div class="picker-item snap-center h-[100px] flex items-center justify-center font-data-lg text-data-lg font-bold w-full inactive" data-value="6">6</div>

<!-- Script for Scroll Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('pickerContainer');
            const items = document.querySelectorAll('.picker-item');
            const dynamicLabelSpan = document.querySelector('#dynamicLabel span:last-child');
            const itemHeight = 100; 

            // Scroll to center item (5) initially
            const initialTarget = document.querySelector('[data-value="5"]');
            if(initialTarget) {
                 setTimeout(() => {
                    initialTarget.scrollIntoView({ behavior: 'auto', block: 'center' });
                 }, 50);
            }

            const recommendations = {
                1: "Active recovery / Maintenance",
                2: "Active recovery / Maintenance",
                3: "Full body or Upper/Lower split",
                4: "Full body or Upper/Lower split",
                5: "PPL or Bro Split recommended",
                6: "PPL or Bro Split recommended",
                7: "Advanced athlete / High risk of overtraining"
            };

            function updateActiveItem() {
                const containerCenter = container.getBoundingClientRect().top + (container.clientHeight / 2);
                
                let closestItem = null;
                let minDistance = Infinity;

                items.forEach(item => {
                    const rect = item.getBoundingClientRect();
                    const itemCenter = rect.top + (rect.height / 2);
                    const distance = Math.abs(containerCenter - itemCenter);

                    if (distance < minDistance) {
                        minDistance = distance;
                        closestItem = item;
                    }
                });

                if (closestItem) {
                    items.forEach(i => {
                        if (i === closestItem) {
                            i.classList.remove('inactive');
                            i.classList.add('active');
                        } else {
                            i.classList.remove('active');
                            i.classList.add('inactive');
                        }
                    });

                    const val = closestItem.getAttribute('data-value');
                    dynamicLabelSpan.textContent = recommendations[val];
                    
                    // Add subtle haptic feedback feeling if supported (simulated by slight label pop)
                    dynamicLabelSpan.parentElement.style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        dynamicLabelSpan.parentElement.style.transform = 'scale(1)';
                    }, 150);
                }
            }

            container.addEventListener('scroll', () => {
                requestAnimationFrame(updateActiveItem);
            });

            // Make clicking snap to item
            items.forEach(item => {
                item.addEventListener('click', () => {
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            });
            
            // Initial update
            updateActiveItem();
        });
    </script>
<style>
        @keyframes glint {
            100% { left: 200%; }
        }
