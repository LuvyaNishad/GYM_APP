<style>
        body {
            background-color: #0A0C10; /* Force exact background */
            color: #e2e2e8;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .primary-glow {
            box-shadow: 0 0 32px rgba(0, 229, 255, 0.25);
        }

        .scroll-wheel-container {
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        }
        
        .wheel-item {
            transition: all 0.2s ease-out;
            opacity: 0.3;
            transform: scale(0.85);
        }
        
        .wheel-item.active {
            opacity: 1;
            transform: scale(1.1);
            color: #00e5ff;
            text-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#0A0C10] text-on-background relative flex flex-col justify-between p-container-margin h-screen">
<!-- Top Progress Section -->
<header class="flex flex-col gap-stack-gap-sm pt-4 w-full max-w-md mx-auto z-10">
<div class="flex justify-between items-center w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-panel hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.2em]">04 / 12</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden mt-4">
<div class="h-full bg-primary-container" style="width: 28%; box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);"></div>
</div>
<div class="mt-8 text-center flex flex-col gap-2">
<h1 class="font-headline-md text-headline-md text-on-background uppercase tracking-wide">PHYSICAL STATS — WEIGHT</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Calibrating physical parameters for optimal performance tracking.</p>
</div>
</header>
<!-- Main Interaction Area (Scroll Wheel) -->
<main class="flex-1 flex flex-col justify-center items-center w-full max-w-md mx-auto relative z-10 my-8">
<div class="relative w-full max-w-xs aspect-square glass-panel rounded-full flex flex-col items-center justify-center border border-white/5 shadow-[inset_0_0_80px_rgba(0,0,0,0.8)] overflow-hidden">
<!-- Unit Toggle -->
<div class="absolute top-8 flex bg-surface-container-low rounded-full p-1 z-20 border border-white/10">
<button class="px-4 py-1 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors" id="btn-lbs" onclick="toggleUnit('lbs')">LBS</button>
<button class="px-4 py-1 rounded-full font-label-caps text-label-caps bg-primary-container/20 text-primary-container border border-primary-container/30" id="btn-kg" onclick="toggleUnit('kg')">KG</button>
</div>
<!-- Focus Indicators -->
<div class="absolute top-1/2 left-0 w-full h-[60px] -translate-y-1/2 border-y border-primary-container/30 bg-primary-container/5 pointer-events-none z-10 flex items-center justify-between px-4">
<div class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_8px_#00e5ff]"></div>
<div class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_8px_#00e5ff]"></div>
</div>
<!-- Scroll Wheel Container -->
<div class="scroll-wheel-container h-full w-full overflow-y-scroll no-scrollbar snap-y snap-mandatory flex flex-col items-center pt-[calc(50%-30px)] pb-[calc(50%-30px)]" id="weight-wheel">
<!-- JavaScript will populate this -->
</div>
<div class="absolute bottom-[20%] font-label-caps text-label-caps text-primary-container/60 z-20 pointer-events-none" id="wheel-unit-label">KG</div>
</div>
</main>
<!-- Bottom Actions -->
<footer class="flex flex-col gap-4 w-full max-w-md mx-auto z-10 pb-4">
<div class="flex gap-4">
<button class="flex-[2] py-4 px-6 rounded-lg bg-primary-container text-on-primary-container font-label-caps text-label-caps primary-glow hover:bg-primary-fixed transition-all uppercase tracking-widest flex items-center justify-center gap-2 font-bold w-full">
                CONFIRM WEIGHT
                <span class="material-symbols-outlined text-[18px]">check</span>
</button>
</div>
</footer>
<script>
        // State
        let currentUnit = 'kg'; // 'kg' or 'lbs'
        
        // Ranges
        const ranges = {
            kg: { min: 40, max: 200, default: 75 },
            lbs: { min: 90, max: 440, default: 165 }
        };

        const wheel = document.getElementById('weight-wheel');

        // Initialize Wheel
        function initWheel() {
            wheel.innerHTML = '';
            const range = ranges[currentUnit];
            
            for (let i = range.min; i <= range.max; i++) {
                const item = document.createElement('div');
                item.className = 'wheel-item h-[60px] flex items-center justify-center snap-center w-full font-data-lg text-data-lg';
                item.textContent = i;
                item.dataset.val = i;
                wheel.appendChild(item);
            }
            
            // Scroll to default
            setTimeout(() => {
                const defaultIndex = range.default - range.min;
                wheel.scrollTop = defaultIndex * 60;
                updateActiveState();
            }, 10);
        }

        function updateActiveState() {
            const items = wheel.querySelectorAll('.wheel-item');
            const center = wheel.scrollTop + (wheel.clientHeight / 2);
            
            items.forEach(item => {
                const itemCenter = item.offsetTop + (item.clientHeight / 2);
                const distance = Math.abs(center - itemCenter);
                
                if (distance < 30) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Unit Toggle Logic
        function toggleUnit(unit) {
            if (currentUnit === unit) return;
            currentUnit = unit;
            
            const btnKg = document.getElementById('btn-kg');
            const btnLbs = document.getElementById('btn-lbs');
            const unitLabel = document.getElementById('wheel-unit-label');
            
            if (unit === 'lbs') {
                btnLbs.className = "px-4 py-1 rounded-full font-label-caps text-label-caps bg-primary-container/20 text-primary-container border border-primary-container/30";
                btnKg.className = "px-4 py-1 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors";
                unitLabel.textContent = "LBS";
            } else {
                btnKg.className = "px-4 py-1 rounded-full font-label-caps text-label-caps bg-primary-container/20 text-primary-container border border-primary-container/30";
                btnLbs.className = "px-4 py-1 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors";
                unitLabel.textContent = "KG";
            }
            
            initWheel();
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            initWheel();
            wheel.addEventListener('scroll', updateActiveState);
        });

    </script>
</body></html>
