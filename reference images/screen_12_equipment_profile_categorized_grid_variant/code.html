<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Equipment Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#251a00",
                        "surface-container-high": "#282a2e",
                        "primary-container": "#00e5ff",
                        "on-surface-variant": "#bac9cc",
                        "surface-container-low": "#1a1c20",
                        "secondary": "#c6c6c7",
                        "secondary-fixed": "#e2e2e2",
                        "error": "#ffb4ab",
                        "surface-tint": "#00daf3",
                        "surface-bright": "#37393e",
                        "inverse-on-surface": "#2f3035",
                        "inverse-surface": "#e2e2e8",
                        "on-tertiary-container": "#6f5500",
                        "on-secondary-fixed-variant": "#454747",
                        "on-secondary-container": "#b4b5b5",
                        "error-container": "#93000a",
                        "outline": "#849396",
                        "tertiary-container": "#fec931",
                        "tertiary-fixed": "#ffdf96",
                        "on-secondary-fixed": "#1a1c1c",
                        "surface": "#111318",
                        "primary-fixed-dim": "#00daf3",
                        "primary": "#c3f5ff",
                        "background": "#111318",
                        "on-primary": "#00363d",
                        "on-primary-container": "#00626e",
                        "on-tertiary-fixed-variant": "#594400",
                        "outline-variant": "#3b494c",
                        "on-primary-fixed-variant": "#004f58",
                        "on-tertiary": "#3e2e00",
                        "inverse-primary": "#006875",
                        "surface-container-highest": "#333539",
                        "on-error": "#690005",
                        "surface-dim": "#111318",
                        "secondary-container": "#454747",
                        "primary-fixed": "#9cf0ff",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#ffeac0",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-secondary": "#2f3131",
                        "surface-container": "#1e2024",
                        "surface-variant": "#333539",
                        "on-surface": "#e2e2e8",
                        "on-background": "#e2e2e8",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-primary-fixed": "#001f24",
                        "surface-container-lowest": "#0c0e12"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "stack-gap-sm": "12px",
                        "stack-gap-lg": "32px",
                        "glass-padding": "24px",
                        "stack-gap-md": "20px"
                    },
                    "fontFamily": {
                        "data-lg": ["JetBrains Mono"],
                        "data-md": ["JetBrains Mono"],
                        "headline-sm": ["Outfit"],
                        "label-caps": ["JetBrains Mono"],
                        "body-lg": ["Outfit"],
                        "display-lg": ["Outfit"],
                        "body-sm": ["Outfit"],
                        "headline-md": ["Outfit"]
                    },
                    "fontSize": {
                        "data-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "data-md": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background-color: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .chip-unselected {
            background-color: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: theme('colors.on-surface-variant');
            transition: all 0.2s ease-in-out;
        }

        .chip-unselected:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .chip-selected {
            background-color: theme('colors.primary-container');
            color: theme('colors.surface-container-low');
            border: 1px solid theme('colors.primary-container');
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            transition: all 0.2s ease-in-out;
        }
        
        .progress-bar-fill {
            background: linear-gradient(90deg, theme('colors.primary-container') 0%, theme('colors.primary-fixed-dim') 100%);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#0A0C10] text-on-surface min-h-screen flex flex-col font-body-lg">
<!-- Top Navigation Placeholder (suppressed for onboarding) -->
<header class="w-full pt-6 px-container-margin flex justify-between items-center z-10 relative">
<div class="w-8 h-8 flex items-center justify-center cursor-pointer opacity-70 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</div>
<div class="font-label-caps text-label-caps text-primary-fixed-dim">
            10 / 12
        </div>
<div class="w-8 h-8"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-container-margin mt-stack-gap-lg max-w-3xl mx-auto w-full z-10 relative pb-32">
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-variant rounded-full mb-stack-gap-lg overflow-hidden">
<div class="h-full progress-bar-fill rounded-full" style="width: 70%;"></div>
</div>
<!-- Header -->
<div class="mb-stack-gap-lg">
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-2 uppercase tracking-tight">EQUIPMENT PROFILE</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">What does your gym have? Select all that apply.</p>
</div>
<!-- Grouped Content -->
<div class="flex flex-col gap-8 w-full">
<!-- Free Weights Section -->
<div class="w-full">
<h2 class="font-display-lg text-lg text-primary-fixed-dim tracking-[0.2em] uppercase border-b border-surface-variant pb-2 mb-4">Free Weights</h2>
<div class="grid grid-cols-3 gap-2 w-full">
<button class="chip-selected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="fitness_center">fitness_center</span>
<span class="font-data-md text-xs text-center leading-tight">Dumbbells</span>
</button>
<button class="chip-selected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="horizontal_rule">horizontal_rule</span>
<span class="font-data-md text-xs text-center leading-tight">Barbell</span>
</button>
<button class="chip-unselected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="crop_square">crop_square</span>
<span class="font-data-md text-xs text-center leading-tight">Squat Rack</span>
</button>
<button class="chip-unselected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="sports_gymnastics">sports_gymnastics</span>
<span class="font-data-md text-xs text-center leading-tight">Kettlebells</span>
</button>
<button class="chip-unselected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="chair">chair</span>
<span class="font-data-md text-xs text-center leading-tight">Bench</span>
</button>
</div>
</div>
<!-- Machines Section -->
<div class="w-full">
<h2 class="font-display-lg text-lg text-primary-fixed-dim tracking-[0.2em] uppercase border-b border-surface-variant pb-2 mb-4">Machines</h2>
<div class="grid grid-cols-3 gap-2 w-full">
<button class="chip-unselected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="cable">cable</span>
<span class="font-data-md text-xs text-center leading-tight">Cable Machine</span>
</button>
<button class="chip-unselected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="settings">settings</span>
<span class="font-data-md text-xs text-center leading-tight">Smith Machine</span>
</button>
<button class="chip-unselected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="airline_seat_legroom_extra">airline_seat_legroom_extra</span>
<span class="font-data-md text-xs text-center leading-tight">Leg Press</span>
</button>
</div>
</div>
<!-- Accessories Section -->
<div class="w-full">
<h2 class="font-display-lg text-lg text-primary-fixed-dim tracking-[0.2em] uppercase border-b border-surface-variant pb-2 mb-4">Accessories</h2>
<div class="grid grid-cols-3 gap-2 w-full">
<button class="chip-selected py-3 px-2 rounded-lg flex flex-col items-center justify-center gap-2 cursor-pointer focus:outline-none">
<span class="material-symbols-outlined text-2xl" data-icon="accessibility_new">accessibility_new</span>
<span class="font-data-md text-xs text-center leading-tight">Pull-up Bar</span>
</button>
</div>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-gradient-to-t from-[#0A0C10] via-[#0A0C10]/90 to-transparent z-20 flex flex-col items-center gap-4 pt-12 pb-8">
<p class="font-label-caps text-label-caps text-on-surface-variant/60 text-center">
            You can update this anytime in Settings
        </p>
<button class="w-full max-w-md bg-primary-container text-surface-container-low font-label-caps text-label-caps py-4 rounded-full uppercase tracking-wider hover:bg-primary transition-colors focus:outline-none flex justify-center items-center gap-2">
            CONFIRM EQUIPMENT
            <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Interactive script for chips -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('button[class^="chip-"]');
            
            chips.forEach(chip => {
                chip.addEventListener('click', function() {
                    if (this.classList.contains('chip-unselected')) {
                        this.classList.remove('chip-unselected');
                        this.classList.add('chip-selected');
                    } else {
                        this.classList.remove('chip-selected');
                        this.classList.add('chip-unselected');
                    }
                });
            });
        });
    </script>
</body></html>
