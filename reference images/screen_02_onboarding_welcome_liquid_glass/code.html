<meta charset="utf-8">

                        "inverse-primary": "#006875",

<style>
        .radar-sweep {
            animation: sweep 4s infinite linear;
            transform-origin: center;
        }
        @keyframes sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(844px, 100dvh);
      max-width: 390px;
      margin: 0 auto;
    }
  </style>


<!-- Top Progress Bar -->
<div class="w-full h-[2px] bg-[#1E2537] absolute top-0 left-0 z-10">
<div class="h-full bg-[#00E5FF] w-[0%] transition-all duration-500 shadow-[0_0_8px_rgba(0,229,255,0.5)]"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 w-full flex flex-col items-center justify-center px-container-margin z-10 mt-8">
<!-- Tactical Grid/Radar Illustration -->
<div class="relative w-[200px] h-[200px] mb-12 flex items-center justify-center">
<!-- Grid Base -->
<svg class="absolute inset-0 w-full h-full opacity-30" viewBox="0 0 200 200">
<defs>
<pattern height="20" id="grid" patternUnits="userSpaceOnUse" width="20">
<path class="text-[#00E5FF]" d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="200" width="200"></rect>
</svg>
<!-- Radar Rings -->
<div class="absolute inset-0 border border-[#00E5FF]/30 rounded-full flex items-center justify-center">
<div class="w-[140px] h-[140px] border border-[#00E5FF]/40 rounded-full flex items-center justify-center pulse-ring"></div>
<div class="absolute w-[80px] h-[80px] border border-[#00E5FF]/60 rounded-full flex items-center justify-center">
<div class="w-2 h-2 bg-[#00E5FF] rounded-full shadow-[0_0_10px_#00E5FF]"></div>
</div>
</div>
<!-- Radar Sweep -->
<div class="absolute inset-0 rounded-full overflow-hidden">
<div class="w-full h-full bg-gradient-to-r from-transparent via-[#00E5FF]/10 to-[#00E5FF]/40 radar-sweep rounded-full origin-bottom-right" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
</div>
<!-- Crosshairs -->
<div class="absolute w-full h-[1px] bg-[#00E5FF]/50"></div>
<div class="absolute h-full w-[1px] bg-[#00E5FF]/50"></div>
</div>
<!-- Typography Block -->
<div class="text-center flex flex-col gap-4 mb-16 px-4">
<h1 class="font-headline-md text-[28px] leading-[36px] font-bold text-white uppercase tracking-wider">
                WELCOME TO LEON
            </h1>
<p class="font-body-lg text-[16px] text-[#8892A4] whitespace-pre-line">Your operational fitness OS.
Built for performance.</p>
</div>
</main>
<!-- Bottom Actions Layer -->
<div class="w-full px-container-margin pb-12 flex flex-col gap-6 z-10">
<!-- LeonButton Primary -->
<button class="w-full bg-[#00E5FF] text-[#0A0C10] font-label-caps text-[13px] font-bold py-4 rounded-full uppercase tracking-[0.1em] shadow-[0_0_20px_rgba(0,229,255,0.2)] hover:shadow-[0_0_30px_rgba(0,229,255,0.4)] transition-all active:scale-95 flex items-center justify-center gap-2">
            COMMENCE OPERATION
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Sign In Link -->
<div class="text-center">
<span class="font-body-sm text-[14px] text-[#8892A4]">Already have an account? </span>
<a class="font-body-sm text-[14px] text-[#00E5FF] hover:text-white transition-colors" href="#">Sign in</a>
</div>
</div>
<!-- Ambient Background Glow -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-[#00E5FF]/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-[#00E5FF]/5 rounded-full blur-[120px]"></div>
</div>
</body></html>
