<!DOCTYPE html><html class="dark" lang="en"><head>

<style>
        body {
            background-color: #0A0C10;
        }
        
        .liquid-glass {
            background: rgba(10, 12, 16, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 229, 255, 0.15);
            box-shadow: inset 0 0 40px rgba(0, 229, 255, 0.05);
        }
        
        .input-fill {
            background: transparent;
        }
        
        .focused-input:focus-within {
            box-shadow: inset 0 -2px 0 0 #00E5FF, 0 10px 30px -10px rgba(0, 229, 255, 0.2);
        }
        
        .btn-glow:hover {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
            color: #00E5FF;
        }
        
        input::placeholder {
            color: rgba(74, 85, 104, 0.5);
        }

        .bg-glyph {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 400px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.02);
            z-index: 0;
            pointer-events: none;
            font-family: 'Outfit', sans-serif;

<body class="min-h-screen flex flex-col items-center p-0 m-0 w-[390px] h-[844px] overflow-hidden bg-[#0A0C10] mx-auto relative">
<!-- Background Glyph -->
<div class="bg-glyph select-none">A</div>
<!-- Progress Indicator -->
<div class="absolute top-8 w-full flex justify-between items-center px-4 mb-2 z-10">
<span class="font-['JetBrains_Mono'] text-[12px] text-[#4A5568]">01 / 12</span>
</div>
<div class="absolute top-[60px] w-full px-4 z-10">
<div class="w-full h-[2px] bg-[#1E2537] rounded-full overflow-hidden">
<div class="h-full bg-[#00E5FF] rounded-full" style="width: 7%;"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="w-full h-full flex flex-col justify-center px-4 animate-[fadeIn_0.5s_ease-out] z-10 relative">
<!-- Matrix Input Area -->
<div class="liquid-glass rounded-[24px] p-8 flex flex-col gap-6 relative overflow-hidden group">
<!-- Header Section Integrated -->
<header class="flex flex-col gap-2">
<h1 class="font-['Outfit'] text-[26px] font-bold uppercase tracking-[1.5px] text-[#EAECF0] text-center">IDENTIFY AGENT</h1>
<p class="font-['Outfit'] text-[15px] text-[#8892A4] text-center">What do we call you?</p>
</header>
<div class="flex flex-col items-center gap-2 mt-4 w-full">
<label class="font-['JetBrains_Mono'] text-[10px] font-medium text-[#00E5FF] tracking-[0.2em] uppercase opacity-70" for="agent-name">DISPLAY_NAME_</label>
<div class="input-fill w-full flex items-center border-b border-[#1E2537] transition-all duration-500 group-focus-within:border-[#00E5FF] pb-2 focused-input">
<span class="font-['JetBrains_Mono'] text-[#00E5FF] text-[20px] mr-2 opacity-50">&gt;</span>
<input autocomplete="off" autofocus="" class="w-full bg-transparent border-none p-0 text-center text-[#EAECF0] font-['Outfit'] text-[32px] font-light focus:ring-0 placeholder:text-[24px] placeholder:font-light" id="agent-name" placeholder="Enter name" type="text">
<!-- Integrated Continue Action -->
<button class="text-[#4A5568] hover:text-[#00E5FF] transition-colors duration-300 ml-2 btn-glow flex items-center justify-center group/btn" title="Continue">
<span class="material-symbols-outlined text-[28px] group-hover/btn:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
</body></html>
