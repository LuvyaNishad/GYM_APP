<style>
        .pulse-ring {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-border {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .5;
                transform: scale(1.1);
            }
        }
    </style>
<style>
        body {
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            min-height: max(844px, 100dvh);
        }
    </style>
</head>
<body class="bg-[#0A0C10] text-on-surface h-screen flex flex-col items-center justify-center overflow-hidden relative shadow-2xl">
<!-- Atmospheric Radial Glow -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
<div class="w-[300px] h-[300px] bg-[rgba(0,229,255,0.04)] rounded-full blur-[80px]"></div>
</div>
<!-- Main Content Canvas -->
<div class="relative z-10 flex flex-col items-center">
<!-- Logo Text -->
<h1 class="font-display-lg text-[34px] font-[800] text-[#00E5FF] tracking-[4px] mb-4">
            L E O N
        </h1>
<!-- Subtitle -->
<p class="font-body-sm text-[11px] font-[500] text-[#8892A4] tracking-[2px] uppercase mb-16">
            OPERATIONAL FITNESS OS
        </p>
<!-- Pulsing Indicator -->
<div class="w-[40px] h-[40px] rounded-full border-2 border-[#00E5FF] flex items-center justify-center pulse-ring shadow-[0_0_12px_rgba(0,229,255,0.6)]">
<div class="w-2 h-2 rounded-full bg-[#00E5FF]"></div>
</div>
</div>
<script>
        // Micro-interaction for splash screen initialization
        document.addEventListener('DOMContentLoaded', () => {
            const content = document.querySelector('.z-10');
            content.style.opacity = '0';
            content.style.transform = 'translateY(10px)';
            content.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
            
            setTimeout(() => {
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
