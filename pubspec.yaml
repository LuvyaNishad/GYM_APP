name: leon
description: "LEON — Operational Fitness OS. A premium, high-performance fitness tracker."
publish_to: "none"

version: 1.0.0+1

environment:
  # json_serializable 6.11+ requires ^3.8.0. Freezed 4.x / riverpod_generator
  # 4.0.6+ / go_router 18.x would need >=3.12, which is ahead of the toolchain
  # this project is pinned to.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  # Riverpod 3: `StateNotifier`/`StateProvider` are legacy; use
  # `Notifier`/`AsyncNotifier`. Auto-dispose is the default — anything that
  # must survive navigation needs an explicit `keepAlive`.
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── Data / Serialisation ──────────────────────────────────────────────────
  # Freezed 3+ requires model classes to be `abstract` (single constructor)
  # or `sealed` (unions).
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Local Storage ─────────────────────────────────────────────────────────
  # `hive`/`hive_flutter` are abandoned and `hive_generator` is Dart-3
  # incompatible. `hive_ce` is the maintained community fork. We store models
  # as JSON maps via their Freezed `toJson`/`fromJson`, so no adapters and no
  # generator are needed.
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # ── Backend / Auth ────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Animations ────────────────────────────────────────────────────────────
  lottie: ^3.3.1

  # ── Charts ────────────────────────────────────────────────────────────────
  # Retained for line/bar charts. The muscle-balance radar is a hand-written
  # CustomPainter — fl_chart's radar can't do the staggered draw-on animation
  # or per-axis weak-point colouring.
  fl_chart: ^1.2.0

  # ── UI Utilities ──────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  # freezed 4.x and riverpod_generator 4.0.6+ require Dart >=3.12; this
  # project is on 3.10.7, so these are the newest compatible majors.
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0

  # ── Linting ───────────────────────────────────────────────────────────────
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/leon_app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
